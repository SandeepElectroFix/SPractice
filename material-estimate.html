<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050816">
    <title>Material Estimate - Sandeep ElectroFix</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="material-estimate.css?v=3.0">
</head>
<body>

    <div class="app-wrapper">
        
        <!-- Top Sticky Header -->
        <header class="app-header">
            <a href="index.html" class="btn-back" aria-label="Back">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </a>
            <div class="header-brand">
                <h1>Material Estimate</h1>
                <span>Sandeep ElectroFix • Lucknow</span>
            </div>
            <button type="button" class="btn-reset-header" onclick="window.EstimateApp.resetAll()" title="Reset All">
                🔄
            </button>
        </header>

        <main class="main-container">
            
            <!-- Client Info Card -->
            <section class="glass-card client-card">
                <div class="card-label">
                    <span class="label-icon">👤</span>
                    <h2>Client Details</h2>
                </div>
                <div class="input-grid">
                    <div class="field-group">
                        <label for="clientName">Client Name</label>
                        <input type="text" id="clientName" placeholder="उदा. Amit Verma" autocomplete="off">
                    </div>
                    <div class="field-group">
                        <label for="clientPhone">Phone Number</label>
                        <input type="tel" id="clientPhone" placeholder="उदा. 9876543210" autocomplete="off">
                    </div>
                </div>
            </section>

            <!-- Search Bar -->
            <div class="search-dock">
                <span class="search-icon">🔍</span>
                <input type="search" id="materialSearch" placeholder="सामग्री या साइज सर्च करें..." autocomplete="off">
                <button type="button" id="clearSearch" class="btn-clear" aria-label="Clear Search">✕</button>
            </div>

            <!-- Stage Navigation Pills -->
            <section class="stages-section">
                <div class="section-title-row">
                    <span class="sub-title">SELECT STAGE</span>
                    <span class="badge-counter" id="productCounter">0 Materials</span>
                </div>
                <div class="stage-pills-wrap" id="categoryContainer">
                    <!-- Dynamic Category Buttons will load here -->
                </div>
            </section>

            <!-- Material Cards Grid -->
            <section class="materials-grid" id="productsGrid">
                <!-- 125 Material Cards will render here -->
            </section>

        </main>

        <!-- Floating Bottom Estimation Dock -->
        <div class="floating-dock">
            <div class="dock-summary">
                <div class="dock-meta">
                    <span class="dock-items-count" id="grandTotalItems">0 Items</span>
                    <span class="dock-label">Grand Total</span>
                </div>
                <div class="dock-amount" id="grandTotal">₹0</div>
            </div>
            <button type="button" class="btn-whatsapp-quote" onclick="window.EstimateApp.sendWhatsAppQuote()">
                <span>💬 WhatsApp Estimate</span>
            </button>
        </div>

    </div>

    <!-- Toast Notification -->
    <div id="appToast" class="app-toast"></div>

    <!-- Core Engine -->
    <script src="material-estimate.js?v=3.0"></script>
</body>
</html>
