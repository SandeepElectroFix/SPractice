<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Material Estimate - Sandeep ElectroFix</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="material-estimate.css">
    <style>
        .stage-btn-group { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
        .stage-btn-group::-webkit-scrollbar { display: none; }
        .stage-btn { flex: 0 0 auto; padding: 8px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.15); background: #0d1426; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; }
        .stage-btn.active { background: linear-gradient(135deg, #00aaff, #0066ff); border-color: transparent; }
    </style>
</head>
<body>
    <div class="materials-page" style="padding: 15px; max-width: 650px; margin: 0 auto; min-height: 100vh; background: #050816; color: #fff;">
        
        <!-- Header -->
        <header style="display:flex; align-items:center; gap:12px; margin-bottom:20px;">
            <a href="index.html" style="background:#0d1426; border:1px solid rgba(255,255,255,0.1); width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; text-decoration:none;">←</a>
            <div>
                <h2 style="margin:0; font-size:18px;">Material Estimate</h2>
                <small style="color:#00aaff;">Sandeep ElectroFix</small>
            </div>
        </header>

        <!-- Client Info Card -->
        <section style="background:#0d1426; border:1px solid rgba(255,255,255,0.1); border-radius:14px; padding:16px; margin-bottom:15px;">
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px; color:#00aaff; font-weight:700;">
                <span>👤</span> <span>Client Information</span>
            </div>
            <div style="margin-bottom:10px;">
                <label style="font-size:11px; color:#9ca3af; display:block; margin-bottom:4px;">Client's Name</label>
                <input type="text" id="clientName" placeholder="Enter client name" style="width:100%; box-sizing:border-box; padding:10px 12px; background:#111a30; border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:#fff;">
            </div>
            <div>
                <label style="font-size:11px; color:#9ca3af; display:block; margin-bottom:4px;">📞 Phone</label>
                <input type="tel" id="clientPhone" placeholder="Enter phone number" style="width:100%; box-sizing:border-box; padding:10px 12px; background:#111a30; border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:#fff;">
            </div>
        </section>

        <!-- Search Bar -->
        <div style="position:relative; margin-bottom:15px;">
            <input type="search" id="materialSearch" placeholder="🔍 Search material..." style="width:100%; box-sizing:border-box; padding:12px 15px; background:#0d1426; border:1px solid rgba(255,255,255,0.1); border-radius:12px; color:#fff;">
        </div>

        <!-- Material Sections -->
        <section style="margin-bottom:20px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <div>
                    <h3 style="margin:0; font-size:16px;">Material Sections</h3>
                    <small style="color:#9ca3af;">Select a stage to view materials</small>
                </div>
                <span id="productCounter" style="background:rgba(0,170,255,0.1); color:#00ffff; padding:3px 10px; border-radius:12px; font-size:11px; font-weight:700;">0 Materials</span>
            </div>

            <!-- Stage Filter Buttons -->
            <div class="stage-btn-group" id="categoryContainer"></div>

            <!-- Products Grid -->
            <div id="productsGrid" style="margin-top:12px;"></div>
        </section>

        <!-- Estimate Summary Card -->
        <section style="background:#0d1426; border:1px solid rgba(255,255,255,0.1); border-radius:14px; padding:16px; margin-bottom:80px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <strong style="color:#fff;">🧾 Estimate Summary</strong>
                <span id="grandTotalItems" style="color:#00aaff; font-size:12px; font-weight:700;">0 Items</span>
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; padding-top:12px; border-top:1px solid rgba(255,255,255,0.1);">
                <span style="color:#9ca3af; font-size:14px;">Total Estimate</span>
                <strong id="grandTotal" style="color:#ffd700; font-size:20px;">₹0</strong>
            </div>
        </section>

    </div>

    <!-- Engine Script -->
    <script src="material-estimate.js?v=9999"></script>
</body>
</html>
