<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>Sandeep ElectroFix - Material Estimate</title>

    <meta
        name="description"
        content="Sandeep ElectroFix Material Estimate System"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         APP
    ====================================================== -->

    <div id="app">

        <!-- HEADER -->
        <header class="app-header">

            <div class="brand-area">

                <div class="logo-box">
                    <img
                        src="../assets/logo.png"
                        alt="Sandeep ElectroFix"
                        id="brandLogo"
                    >
                </div>

                <div class="brand-text">
                    <h1>SANDEEP ELECTROFIX</h1>
                    <p data-i18n="materialEstimate">
                        Material Estimate
                    </p>
                </div>

            </div>

            <!-- LANGUAGE -->
            <div class="language-switch">

                <button
                    type="button"
                    class="lang-btn active"
                    data-lang="hi"
                >
                    हिंदी
                </button>

                <button
                    type="button"
                    class="lang-btn"
                    data-lang="en"
                >
                    English
                </button>

            </div>

        </header>


        <!-- =================================================
             SEARCH
        ================================================== -->

        <section class="search-section">

            <div class="search-box">

                <span class="search-icon">⌕</span>

                <input
                    type="search"
                    id="materialSearch"
                    data-placeholder-hi="सामग्री खोजें..."
                    data-placeholder-en="Search material..."
                    placeholder="सामग्री खोजें..."
                    autocomplete="off"
                >

                <button
                    type="button"
                    id="clearSearch"
                    class="clear-search"
                    aria-label="Clear search"
                >
                    ×
                </button>

            </div>

            <!-- SEARCH RESULTS -->
            <div
                id="searchResults"
                class="search-results hidden"
            ></div>

        </section>


        <!-- =================================================
             MAIN MENU
        ================================================== -->

        <main class="main-content">

            <div class="section-heading">

                <span class="heading-icon">⚡</span>

                <div>
                    <h2 data-i18n="selectMaterial">
                        Material Catalogue
                    </h2>

                    <p data-i18n="selectCategory">
                        Select a category to continue
                    </p>
                </div>

            </div>


            <!-- STAGE / MENU BUTTONS -->

            <section
                id="stageMenu"
                class="stage-menu"
            >

                <!-- Generated by JavaScript -->

            </section>


            <!-- ALL MATERIALS -->

            <button
                type="button"
                id="allMaterialsBtn"
                class="all-materials-btn"
            >

                <span class="menu-icon">📦</span>

                <span
                    data-i18n="allMaterials"
                >
                    All Materials
                </span>

                <span class="menu-arrow">›</span>

            </button>

        </main>


        <!-- =================================================
             MATERIAL NAVIGATION PANEL
        ================================================== -->

        <section
            id="cataloguePanel"
            class="catalogue-panel hidden"
        >

            <div class="panel-header">

                <button
                    type="button"
                    id="backBtn"
                    class="back-btn"
                >
                    ‹
                </button>

                <div>

                    <h2 id="panelTitle">
                        Material
                    </h2>

                    <p id="panelSubtitle">
                        Select an item
                    </p>

                </div>

                <button
                    type="button"
                    id="closePanel"
                    class="close-btn"
                >
                    ×
                </button>

            </div>


            <!-- DYNAMIC LEVELS -->

            <div
                id="catalogueContent"
                class="catalogue-content"
            ></div>

        </section>


        <!-- =================================================
             FINAL ESTIMATE
        ================================================== -->

        <section
            id="estimateSection"
            class="estimate-section"
        >

            <div class="estimate-header">

                <div>

                    <h2 data-i18n="finalEstimate">
                        Final Estimate
                    </h2>

                    <p data-i18n="estimateList">
                        Estimate List
                    </p>

                </div>

                <span
                    id="estimateCount"
                    class="estimate-count"
                >
                    0
                </span>

            </div>


            <!-- COMPACT ESTIMATE LIST -->

            <div
                id="estimateList"
                class="estimate-list"
            >

                <div
                    id="emptyEstimate"
                    class="empty-estimate"
                >

                    <span>📋</span>

                    <p data-i18n="noItems">
                        No materials added yet
                    </p>

                </div>

            </div>


            <!-- TOTALS -->

            <div
                id="estimateTotals"
                class="estimate-totals hidden"
            >

                <div class="total-row">
                    <span data-i18n="subtotal">
                        Subtotal
                    </span>

                    <strong id="subtotalAmount">
                        ₹0.00
                    </strong>
                </div>


                <div class="total-row">

                    <span data-i18n="discount">
                        Discount
                    </span>

                    <input
                        type="number"
                        id="discountInput"
                        value="0"
                        min="0"
                    >

                </div>


                <div class="total-row">

                    <span data-i18n="labour">
                        Labour / Extra
                    </span>

                    <input
                        type="number"
                        id="labourInput"
                        value="0"
                        min="0"
                    >

                </div>


                <div class="grand-total">

                    <span data-i18n="grandTotal">
                        Grand Total
                    </span>

                    <strong id="grandTotalAmount">
                        ₹0.00
                    </strong>

                </div>

            </div>

        </section>


        <!-- =================================================
             FOOTER
        ================================================== -->

        <footer class="app-footer">

            <strong>SANDEEP ELECTROFIX</strong>

            <span>
                © <span id="currentYear"></span>
            </span>

        </footer>

    </div>


    <!-- =====================================================
         EDIT ITEM MODAL
    ====================================================== -->

    <div
        id="editModal"
        class="modal-overlay hidden"
    >

        <div class="modal-box">

            <div class="modal-header">

                <h2 data-i18n="editItem">
                    Edit Item
                </h2>

                <button
                    type="button"
                    id="closeEditModal"
                    class="close-btn"
                >
                    ×
                </button>

            </div>


            <div
                id="editModalContent"
                class="modal-content"
            ></div>

        </div>

    </div>


    <!-- =====================================================
         SCRIPTS
    ====================================================== -->

    <script src="script.js"></script>

</body>
</html>
